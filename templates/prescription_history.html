<!DOCTYPE html>
<html>
<head>
    <title>Prescription History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1>💊 Prescription History</h1>

    <a href="/" class="btn btn-secondary">
        Dashboard
    </a>

    <br><br>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
               <th>Patient</th>
<th>Doctor</th>
<th>Visit Date</th>
<th>Diagnosis</th>
<th>Medicine</th>
<th>Dosage</th>
<th>Frequency</th>
<th>Start Date</th>
<th>End Date</th>
            </tr>
        </thead>

        <tbody>

        {% for row in history %}
        <tr>
           <td>{{ row[0] }}</td>  <!-- Patient -->
<td>{{ row[1] }}</td>  <!-- Doctor -->
<td>{{ row[2] }}</td>  <!-- Visit Date -->
<td>{{ row[3] }}</td>  <!-- Diagnosis -->
<td>{{ row[4] }}</td>  <!-- Medicine -->
<td>{{ row[5] }}</td>  <!-- Dosage -->
<td>{{ row[6] }}</td>  <!-- Frequency -->
<td>{{ row[7] }}</td>  <!-- Start Date -->
<td>{{ row[8] }}</td>  <!-- End Date -->
        </tr>
        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
