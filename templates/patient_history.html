<!DOCTYPE html>
<html>
<head>
    <title>Patient History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1>📋 Patient Medical History</h1>

    <table class="table table-bordered">

        <tr>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Visit Date</th>
            <th>Diagnosis</th>
            <th>Medicine</th>
            <th>Dosage</th>
        </tr>

        {% for row in history %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
