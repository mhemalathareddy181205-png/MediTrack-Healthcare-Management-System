<!DOCTYPE html>
<html>
<head>
    <title>Edit Patient</title>
</head>
<body>

<h1>Edit Patient</h1>

<form method="POST">

    Name:<br>
    <input type="text" name="full_name" value="{{ patient[1] }}"><br><br>

    DOB:<br>
    <input type="date" name="dob" value="{{ patient[2] }}"><br><br>

    Gender:<br>
    <input type="text" name="gender" value="{{ patient[3] }}"><br><br>

    Blood Group:<br>
    <input type="text" name="blood_group" value="{{ patient[4] }}"><br><br>

    Contact:<br>
    <input type="text" name="contact" value="{{ patient[5] }}"><br><br>

    Email:<br>
    <input type="email" name="email" value="{{ patient[6] }}"><br><br>

    Address:<br>
    <input type="text" name="address" value="{{ patient[7] }}"><br><br>

    Emergency Contact:<br>
    <input type="text" name="emergency_contact" value="{{ patient[8] }}"><br><br>

    <button type="submit">Update Patient</button>

</form>

</body>
</html>
